<!doctype html><meta charset="utf-8"><title>Anime Capital</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;700&family=Caveat:wght@700&display=swap"><style>body{margin:0;background:#24302a}canvas{width:100%;max-width:1280px;display:block;margin:auto}</style><canvas id="cv" width="1280" height="720"></canvas><script>
const cv=document.getElementById('cv'),c=cv.getContext('2d'),W=1280,H=720;
/* ---------- paper helpers ---------- */
function sh(on=true,d=5){c.shadowColor=on?'rgba(0,0,0,.28)':'transparent';c.shadowBlur=on?d*1.6:0;c.shadowOffsetY=on?d:0;c.shadowOffsetX=0}
function fill(col,fn,d=5){c.save();sh(true,d);c.fillStyle=col;c.beginPath();fn();c.fill();c.restore()}
function rr(x,y,w,h,r){c.roundRect?c.roundRect(x,y,w,h,r):c.rect(x,y,w,h)}
function circ(x,y,r){c.moveTo(x+r,y);c.arc(x,y,r,0,7)}
function ell(x,y,rx,ry,rot=0){c.moveTo(x+rx*Math.cos(rot),y+rx*Math.sin(rot));c.ellipse(x,y,rx,ry,rot,0,7)}
const grain=(()=>{const g=document.createElement('canvas');g.width=g.height=160;const x=g.getContext('2d');const d=x.createImageData(160,160);
  for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=14}x.putImageData(d,0,0);return g})();
let grainPat;
function sky(a,b){const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,a);g.addColorStop(1,b);c.fillStyle=g;c.fillRect(0,0,W,H)}
function hills(y,col,amp,seed,t=0,d=4){fill(col,()=>{c.moveTo(0,H);c.lineTo(0,y);
  for(let x=0;x<=W;x+=40){c.lineTo(x,y-Math.abs(Math.sin(x*.004+seed))*amp-Math.sin(x*.011+seed*3)*amp*.3)}c.lineTo(W,H)},d)}
function ground(y,col){fill(col,()=>{c.moveTo(0,H);c.lineTo(0,y);c.bezierCurveTo(W*.3,y-20,W*.6,y+25,W,y-5);c.lineTo(W,H)},6)}
function pine(x,y,s,col='#2f7a46',t=0){const sw=Math.sin(t*1.3+x)*2*s;
  fill('#5a3a22',()=>{c.rect(x-4*s,y-30*s,8*s,30*s)},3);
  for(let i=0;i<3;i++){const yy=y-30*s-i*38*s,w=(60-i*13)*s;fill(col,()=>{c.moveTo(x-w+sw*.4,yy);c.lineTo(x+w+sw*.4,yy);c.lineTo(x+sw,yy-70*s)},5)}}
function blob(x,y,s,col,t=0){fill('#5a3a22',()=>{c.rect(x-5*s,y-70*s,10*s,70*s)},3);
  fill(col,()=>{const w=Math.sin(t+x)*3;circ(x-26*s+w,y-90*s,30*s);circ(x+24*s+w,y-95*s,32*s);circ(x+w,y-125*s,36*s)},6)}
function fire(x,y,s,t){fill('#6b4425',()=>{c.save();c.translate(x,y);c.rotate(.25);c.rect(-45*s,-6*s,90*s,12*s);c.restore()},3);
  fill('#5a3a22',()=>{c.save();c.translate(x,y);c.rotate(-.25);c.rect(-45*s,-6*s,90*s,12*s);c.restore()},3);
  [['#f5c13b',1],['#ef7d2d',.72],['#e04a2a',.45]].forEach(([col,k],i)=>{const f=Math.sin(t*9+i*2)*6*s,h=(90+Math.sin(t*6+i)*10)*k*s;
    fill(col,()=>{c.moveTo(x-30*k*s,y-4*s);c.quadraticCurveTo(x-34*k*s,y-h*.6,x+f,y-h);c.quadraticCurveTo(x+34*k*s,y-h*.6,x+30*k*s,y-4*s)},2)});
  c.save();c.globalCompositeOperation='lighter';const g=c.createRadialGradient(x,y-40*s,5,x,y-40*s,220*s);g.addColorStop(0,'rgba(255,170,60,.28)');g.addColorStop(1,'rgba(255,170,60,0)');c.fillStyle=g;c.fillRect(x-240*s,y-260*s,480*s,480*s);c.restore()}
function stars(t,n=60){c.save();for(let i=0;i<n;i++){const x=(i*197)%W,y=(i*83)%(H*.45),a=.4+.4*Math.sin(t*2+i);c.fillStyle=`rgba(255,250,220,${a})`;c.beginPath();circ(x,y,1.6+(i%3)*.6);c.fill()}c.restore()}
function moon(x,y,r){fill('#f6efcf',()=>circ(x,y,r),4);fill('#e7dfba',()=>{circ(x-r*.3,y-r*.2,r*.18);circ(x+r*.25,y+r*.3,r*.12)},0)}
function water(y,t,col='#2aa0d8'){fill(col,()=>{c.moveTo(0,H);c.lineTo(0,y);for(let x=0;x<=W;x+=20)c.lineTo(x,y+Math.sin(x*.02+t*2)*5);c.lineTo(W,H)},5);
  c.save();c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=3;for(let i=0;i<6;i++){const xx=((i*230+t*40)%(W+200))-100,yy=y+30+i*12;c.beginPath();c.moveTo(xx,yy);c.lineTo(xx+50,yy);c.stroke()}c.restore()}
function eye(x,y,r=6){fill('#fff',()=>circ(x,y,r),1);fill('#222',()=>circ(x+r*.25,y,r*.5),0)}
function txt(s,x,y,size=40,col='#2a241c',font='Fredoka',align='center'){c.save();c.font=`700 ${size}px ${font},sans-serif`;c.textAlign=align;c.fillStyle=col;sh(true,3);c.fillText(s,x,y);c.restore()}

/* ---------- characters ---------- */
function person(x,y,s,robe,skin='#c48a5c',t=0,beard=false,hat=null){
  fill(robe,()=>{c.moveTo(x-34*s,y);c.lineTo(x-24*s,y-110*s);c.quadraticCurveTo(x,y-124*s,x+24*s,y-110*s);c.lineTo(x+34*s,y)},6);
  fill(skin,()=>circ(x,y-140*s+Math.sin(t*2+x)*1.5,24*s),4);
  fill('#2a1d14',()=>{c.arc(x,y-146*s+Math.sin(t*2+x)*1.5,25*s,Math.PI*1.05,Math.PI*1.95)},1);
  if(beard)fill('#3a2a1c',()=>{c.moveTo(x-20*s,y-136*s);c.quadraticCurveTo(x,y-100*s,x+20*s,y-136*s)},2);
  eye(x-8*s,y-142*s,4*s);eye(x+8*s,y-142*s,4*s);
  if(hat)fill(hat,()=>{ell(x,y-160*s,40*s,9*s);c.moveTo(x-20*s,y-160*s);c.quadraticCurveTo(x,y-195*s,x+20*s,y-160*s)},3)}
function carabao(x,y,s,t,talk){const b=Math.sin(t*2)*2;
  fill('#4f5560',()=>{c.rect(x-70*s,y-40*s,22*s,40*s);c.rect(x+40*s,y-40*s,22*s,40*s)},3);
  fill('#5d6470',()=>{ell(x-5*s,y-75*s+b,95*s,52*s)},6);
  c.save();c.strokeStyle='#4f5560';c.lineWidth=6*s;c.lineCap='round';c.beginPath();c.moveTo(x-95*s,y-85*s);c.quadraticCurveTo(x-120*s,y-60*s+Math.sin(t*3)*12*s,x-112*s,y-30*s);c.stroke();c.restore();
  const hx=x+95*s,hy=y-92*s+Math.sin(t*1.6)*3;
  fill('#e9e2cc',()=>{c.moveTo(hx-30*s,hy-28*s);c.quadraticCurveTo(hx-90*s,hy-80*s,hx-40*s,hy-95*s);c.quadraticCurveTo(hx-60*s,hy-60*s,hx-12*s,hy-34*s);
    c.moveTo(hx+30*s,hy-28*s);c.quadraticCurveTo(hx+90*s,hy-80*s,hx+40*s,hy-95*s);c.quadraticCurveTo(hx+60*s,hy-60*s,hx+12*s,hy-34*s)},4);
  fill('#6b7380',()=>{ell(hx,hy,38*s,42*s)},5);fill('#8a8f99',()=>ell(hx,hy+26*s,26*s,18*s),2);
  eye(hx-14*s,hy-10*s,7*s);eye(hx+14*s,hy-10*s,7*s);fill('#333',()=>{circ(hx-9*s,hy+28*s,3.5*s);circ(hx+9*s,hy+28*s,3.5*s)},0);
  if(talk)fill('#3a2a2a',()=>ell(hx,hy+40*s,8*s,Math.abs(Math.sin(t*14))*5*s+1),0);
  // sampaguita garland
  for(let i=0;i<9;i++)fill('#fffdf2',()=>circ(hx-30*s+i*7.5*s,hy+50*s+Math.sin(i/8*Math.PI)*10*s,5*s),1)}
function tarsier(x,y,s,t,talk){const hop=Math.abs(Math.sin(t*2.2))*8*s;y-=hop;
  c.save();c.strokeStyle='#8a6440';c.lineWidth=4*s;c.beginPath();c.moveTo(x-20*s,y-20*s);c.quadraticCurveTo(x-60*s,y,x-50*s,y+30*s+hop);c.stroke();c.restore();
  fill('#a77c52',()=>ell(x,y-40*s,28*s,38*s),5);fill('#c9a07a',()=>ell(x+4*s,y-34*s,15*s,24*s),1);
  fill('#a77c52',()=>{ell(x-14*s,y-2*s,16*s,7*s);ell(x+14*s,y-2*s,16*s,7*s)},2);
  const hy=y-95*s+Math.sin(t*3)*2;fill('#a77c52',()=>{ell(x-30*s,hy-24*s,13*s,17*s);ell(x+30*s,hy-24*s,13*s,17*s)},3);
  fill('#b88b5e',()=>ell(x,hy,40*s,34*s),5);
  [[-16,0],[16,0]].forEach(([dx])=>{fill('#f2d27a',()=>circ(x+dx*s,hy-4*s,15*s),1);fill('#1d140c',()=>circ(x+dx*s+2*s,hy-4*s,9*s),0);fill('#fff',()=>circ(x+dx*s+5*s,hy-8*s,3*s),0)});
  fill('#5a3a22',()=>circ(x,hy+12*s,3*s),0);if(talk)fill('#5a2a1a',()=>ell(x,hy+22*s,5*s,Math.abs(Math.sin(t*15))*4*s+1),0)}
function nipa(x,y,s,col='#c9a46a'){fill('#8a6a3e',()=>{c.rect(x-60*s,y-20*s,8*s,20*s);c.rect(x+52*s,y-20*s,8*s,20*s)},2);
  fill(col,()=>c.rect(x-62*s,y-95*s,124*s,76*s),5);fill('#6e4e2a',()=>c.rect(x-14*s,y-70*s,28*s,50*s),1);
  fill('#9c7a3c',()=>{c.moveTo(x-90*s,y-90*s);c.lineTo(x,y-165*s);c.lineTo(x+90*s,y-90*s)},6)}

/* ---------- mixed cut-out styles (all deterministic) ---------- */
const hr=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const clamp01=x=>x<0?0:x>1?1:x;
function bg(col){c.fillStyle=col;c.fillRect(-40,-40,W+80,H+80)}
function cardboard(col='#b07a45'){bg(col);c.save();
 for(let x=-40;x<W+40;x+=9){c.fillStyle=`rgba(70,40,12,${.05+.04*Math.sin(x*.7)})`;c.fillRect(x,-40,3,H+80)}
 for(let i=0;i<220;i++){const lt=hr(i)>.5;c.fillStyle=lt?'rgba(255,225,180,.08)':'rgba(60,30,8,.08)';c.beginPath();c.ellipse(hr(i*3)*W,hr(i*7)*H,4+hr(i*11)*30,2+hr(i*13)*8,0,0,7);c.fill()}
 const v=c.createRadialGradient(W/2,H/2,100,W/2,H/2,W*.7);v.addColorStop(0,'rgba(255,220,160,.14)');v.addColorStop(1,'rgba(40,20,5,.35)');c.fillStyle=v;c.fillRect(-40,-40,W+80,H+80);c.restore()}
// crumpled paper card: faceted light and shade
function crumple(x,y,w,h,base='#f4f2ee',seed=1,d=8){c.save();sh(true,d);c.fillStyle=base;c.beginPath();c.moveTo(x,y);c.lineTo(x+w,y+4);c.lineTo(x+w-3,y+h);c.lineTo(x+3,y+h-4);c.closePath();c.fill();sh(false);c.clip();
 const nx=8,ny=5,P=[];for(let j=0;j<=ny;j++)for(let i=0;i<=nx;i++){const k=seed*100+j*13+i;P.push([x+i/nx*w+(i&&i<nx?(hr(k)-.5)*w/nx*.8:0),y+j/ny*h+(j&&j<ny?(hr(k+50)-.5)*h/ny*.8:0)])}
 for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){const a=P[j*(nx+1)+i],b=P[j*(nx+1)+i+1],d2=P[(j+1)*(nx+1)+i],e=P[(j+1)*(nx+1)+i+1];
  [[a,b,e],[a,e,d2]].forEach((tr,q)=>{const s=hr(seed*7+j*31+i*3+q)*.16-.06;c.fillStyle=s>0?`rgba(0,0,0,${s})`:`rgba(255,255,255,${-s*2.5})`;c.beginPath();c.moveTo(...tr[0]);c.lineTo(...tr[1]);c.lineTo(...tr[2]);c.fill()})}
 c.restore()}
// crayon on construction paper: flat fill plus waxy hatching
function crayon(col,fn,d=4){c.save();sh(true,d);c.fillStyle=col;c.beginPath();fn();c.fill();sh(false);c.clip();c.lineWidth=1.4;
 c.strokeStyle='rgba(255,255,255,.22)';c.beginPath();for(let i=-H;i<W;i+=6){c.moveTo(i,0);c.lineTo(i+H*.4,H)}c.stroke();
 c.strokeStyle='rgba(0,0,0,.12)';c.beginPath();for(let i=-H+3;i<W;i+=11){c.moveTo(i,0);c.lineTo(i+H*.4,H)}c.stroke();c.restore()}
// watercolour cut-out: soft wash, darker pooled edge, ink outline
function wc(col,fn,seed=1){c.save();c.fillStyle=col;c.globalAlpha=.9;c.beginPath();fn();c.fill();c.globalAlpha=1;c.clip();
 for(let i=0;i<14;i++){c.fillStyle=`rgba(${hr(seed+i)>.5?'255,250,235':'60,40,20'},.1)`;c.beginPath();c.ellipse(hr(seed*3+i)*W,hr(seed*5+i)*H,40+hr(seed+i*2)*120,30+hr(seed+i*4)*70,hr(i)*3,0,7);c.fill()}
 c.restore();c.save();c.strokeStyle='rgba(70,45,25,.55)';c.lineWidth=2.2;c.beginPath();fn();c.stroke();c.restore()}
// silhouette (shadow-puppet look)
function sil(fn,col='#070a14'){c.save();c.fillStyle=col;c.beginPath();fn();c.fill();c.restore()}
// wood-grain paper
function wood(col,fn,d=5,seed=1){c.save();sh(true,d);c.fillStyle=col;c.beginPath();fn();c.fill();sh(false);c.clip();c.strokeStyle='rgba(90,40,10,.28)';c.lineWidth=1.5;
 for(let y=-20;y<H+20;y+=7){c.beginPath();for(let x=0;x<=W;x+=30)c.lineTo(x,y+Math.sin(x*.012+y*.05+seed)*5+Math.sin(x*.04+y)*1.5);c.stroke()}c.restore()}
// gritty grey card with scratches and speckle
function grit(col,fn,d=6,seed=1){c.save();sh(true,d);c.fillStyle=col;c.beginPath();fn();c.fill();sh(false);c.clip();
 for(let i=0;i<260;i++){c.fillStyle=hr(seed+i)>.5?'rgba(0,0,0,.18)':'rgba(255,255,255,.14)';c.fillRect(hr(seed*2+i)*W,hr(seed*9+i)*H,1.5+hr(i)*2,1.5+hr(i*5)*2)}
 c.strokeStyle='rgba(0,0,0,.18)';c.lineWidth=1;for(let i=0;i<30;i++){const x=hr(seed*4+i)*W,y=hr(seed*6+i)*H;c.beginPath();c.moveTo(x,y);c.lineTo(x+20+hr(i)*50,y+(hr(i*3)-.5)*20);c.stroke()}c.restore()}
function hand(s,x,y,size=34,col='#2a241c',align='center',rot=0){c.save();c.translate(x,y);c.rotate(rot);c.font=`700 ${size}px Caveat,cursive`;c.textAlign=align;c.fillStyle=col;c.fillText(s,0,0);c.restore()}
function bubble(x,y,w,h,txtS,col='#fffdf4',ink='#2a241c',size=26){fill(col,()=>{rr(x-w/2,y-h/2,w,h,16);c.moveTo(x-12,y+h/2-2);c.lineTo(x-22,y+h/2+22);c.lineTo(x+8,y+h/2-2)},4);hand(txtS,x,y+size*.33,size,ink)}
const pop=(t,t0,d=.5)=>{const p=clamp01((t-t0)/d);return p<1?1-Math.pow(1-p,3)*Math.cos(p*8)*1:1};

/* ---------- characters added for this story ---------- */
function blanket(x,y,w,h,t){c.save();fill('#3a6fd8',()=>rr(x,y,w,h,14),4);c.beginPath();rr(x,y,w,h,14);c.clip();for(let i=0;i<6;i++)fill(i%2?'#f4c430':'#e63946',()=>c.rect(x,y+8+i*14,w,5),0);c.restore()}
function sleepyTarsier(x,y,s,t){tarsier(x,y,s,0,false);const hy=y-95*s;[-16,16].forEach(dx=>{fill('#b88b5e',()=>circ(x+dx*s,hy-4*s,16*s),0);c.save();c.strokeStyle='#5a3a22';c.lineWidth=3*s;c.beginPath();c.arc(x+dx*s,hy-6*s,9*s,.3,Math.PI-.3);c.stroke();c.restore()});
 [0,1,2].forEach(i=>{const p=((t*.5+i/3)%1);c.save();c.globalAlpha=1-p;hand('z',x+40*s+p*40,hy-30*s-p*70,22+p*16,'#f3ecd6');c.restore()})}
function owl(x,y,s,t){fill('#6e4e2a',()=>ell(x,y,26*s,34*s),4);fill('#8a6a3e',()=>ell(x,y+8*s,16*s,22*s),1);fill('#6e4e2a',()=>{c.moveTo(x-22*s,y-22*s);c.lineTo(x-26*s,y-44*s);c.lineTo(x-8*s,y-28*s);c.moveTo(x+22*s,y-22*s);c.lineTo(x+26*s,y-44*s);c.lineTo(x+8*s,y-28*s)},2);
 const bl=Math.sin(t*1.3)>.96?.15:1;[-10,10].forEach(dx=>{fill('#f2d27a',()=>ell(x+dx*s,y-14*s,9*s,9*s*bl),0);fill('#111',()=>ell(x+dx*s,y-14*s,4*s,4*s*bl),0)});fill('#e8a13a',()=>{c.moveTo(x-3*s,y-6*s);c.lineTo(x+3*s,y-6*s);c.lineTo(x,y+2*s)},0)}
function windowFrame(x,y,w,h,inner){c.save();c.beginPath();c.rect(x,y,w,h);c.clip();inner();c.restore();
 wood('#8a5a2e',()=>{c.rect(x-14,y-14,w+28,14);c.rect(x-14,y+h,w+28,14);c.rect(x-14,y,14,h);c.rect(x+w,y,14,h);c.rect(x+w/2-6,y,12,h)},6,2)}
function lamp(x,y,t){fill('#6b4425',()=>{rr(x-16,y-10,32,22,6)},3);const f=1+Math.sin(t*9)*.08+Math.sin(t*13)*.05;
 c.save();c.globalCompositeOperation='lighter';const g=c.createRadialGradient(x,y-26,2,x,y-26,140);g.addColorStop(0,'rgba(255,200,90,.45)');g.addColorStop(1,'rgba(255,200,90,0)');c.fillStyle=g;c.fillRect(x-150,y-170,300,300);c.restore();
 fill('#ffcf5a',()=>{c.moveTo(x,y-10);c.quadraticCurveTo(x-10*f,y-26,x,y-46*f);c.quadraticCurveTo(x+10*f,y-26,x,y-10)},0)}
function homeSet(t,windowInner){cardboard('#a8713f');
 windowFrame(720,60,440,300,windowInner);
 c.save();c.translate(0,0);crumple(-20,560,W+40,200,'#d6bd8f',11,6);c.restore();
 // woven banig mat
 c.save();c.translate(260,600);c.scale(1,.35);fill('#c9a46a',()=>ell(0,0,330,170),4);c.restore();
 for(let i=0;i<8;i++)fill(i%2?'#b5904f':'#d8b276',()=>{c.save();c.translate(260,600);c.scale(1,.35);c.rect(-300+i*75,-150,36,300);c.restore()},0);
 lamp(110,520,t)}
const nightSky=()=>{const g=c.createLinearGradient(0,0,0,400);g.addColorStop(0,'#0f1838');g.addColorStop(1,'#2b3f6e');c.fillStyle=g;c.fillRect(0,0,W,H)};
function bamboo(x,t,col='#123018'){for(let k=0;k<3;k++){const sw=Math.sin(t*1.1+k+x)*10;c.save();c.strokeStyle=col;c.lineWidth=10-k*2;c.beginPath();c.moveTo(x+k*24,H);c.quadraticCurveTo(x+k*24,250,x+k*24+sw,40);c.stroke();
 for(let j=0;j<5;j++){const yy=120+j*60,xx=x+k*24+sw*(1-yy/H);fill(col,()=>{c.moveTo(xx,yy);c.quadraticCurveTo(xx+30,yy-14+Math.sin(t*2+j)*4,xx+58,yy+4);c.quadraticCurveTo(xx+30,yy+2,xx,yy)},0)}c.restore()}}

function titleCard(t){cardboard('#a8743f');const sw=Math.sin(t*1.2)*.012;
 c.save();c.strokeStyle='#2a1d14';c.lineWidth=2;c.beginPath();c.moveTo(420,-10);c.lineTo(400,120);c.moveTo(880,-10);c.lineTo(890,124);c.stroke();c.restore();
 c.save();c.translate(640,330);c.rotate(-.02+sw);c.translate(-640,-330);
 crumple(330,110,620,430,'#f6f4f0',5,10);
 // paper clips

     for(let i=0;i<4;i++){const p=((t*.9+i/4)%1);c.save();c.translate(790,240);c.rotate(-p*.6);c.globalAlpha=1-p*.6;stk('#ffffff',()=>rr(-60,-70+p*-40,120,140,8),2,5);fill('#e63946',()=>c.rect(-60,-70+p*-40,120,30),0);c.restore()}hand('months...',790,360,36,'#3a2a1c');c.restore()})}});

   const talk=Math.abs(Math.sin(t*7))>.4,hl=li===0&&since('benshi')>=0&&since('benshi')<2.5;if(hl)glow(1080,470,200,'255,220,150',.5);

{chap:'The God of Manga',era:1,lines:[
 'After the war, a young doctor named Osamu Tezuka decided he would rather draw comics than treat patients.',
 'He filled his manga with movie tricks: close-ups, dramatic angles, and big, expressive eyes.',
 'Fans called him the God of Manga, and editors sometimes waited outside his door all night for his pages.'],

   toon(420,640,1.05,t,M(TEZ,{pose:pen?'point':'stand',look:pen?.8:.2,mouth:pen?'grin':'smile'}));beret(420,640,1.05);

   const pY=110;[['close-ups',0],['dramatic',1],['eyes',2]].forEach(([w,i])=>mangaPanel(60+i*170,pY,150,150,vis(li,1,w,2),(x,y)=>{
    if(i===0){toon(x,y+150,1.2,t,M(TEZ,{glasses:false,mouth:'o',pop:true}))}
    if(i===1){c.save();c.translate(x,y);c.rotate(-.35);stk('#3a6fd8',()=>c.rect(-30,-60,60,120),2,0);line([[-80,70],[80,-70]],DK,3);line([[-80,40],[80,-100]],DK,2);c.restore()}
    if(i===2){[-28,28].forEach(dx=>{stk('#fff',()=>ell(x+dx,y,22,30),2.4,0);fill('#5a4a9a',()=>ell(x+dx,y+4,15,20),0);fill(DK,()=>ell(x+dx,y+6,7,10),0);fill('#fff',()=>{circ(x+dx+6,y-6,6);circ(x+dx-4,y+12,3)},0)})}}));
   if(li===2&&since('god')>=0&&since('god')<3)glow(420,420,220,'255,230,150',.5*Math.sin(clamp01(since('god')/3)*Math.PI));
   // the hallway: editors waiting all night
   if(li===2){const n=since('editors')>=0?Math.min(3,1+Math.floor(since('editors')/.8)):0;for(let i=0;i<n;i++){const ex=930+i*100;toon(ex,700,.75,t+i,{hair:['short','pony','bald'][i],hairC:'#2a2a2a',top:['#9aa4b4','#c8a46a','#7fbf9a'][i],bot:'#3a3a4a',glasses:i!==1,pose:'sit',mouth:'flat',face:-1,look:-.8});zzz(ex+20,520,t+i)}
    const pg=since('pages');if(pg>=0){const p=EASE(clamp01(pg/1.2));news('#fdfbf2',()=>rr(780+p*90,690,90,14,2),71,.3)}}});
  PL(t,1.6,()=>{fill('#120e1a',()=>{c.moveTo(-160,H+60);c.lineTo(-160,380);c.quadraticCurveTo(-40,400,40,H+60)},0)})}},

{chap:'Astro Boy on TV',era:2,lines:[
 'Then, on New Year\'s Day, nineteen sixty-three, Tezuka\'s Astro Boy flew onto Japanese television.',
 'A weekly cartoon was very expensive, so his team got clever. They reused drawings, moved only the mouths, and slid pictures across the screen.',
 'This cheaper style, called limited animation, became part of the anime look. Sometimes, being short on money is the mother of invention.',
 'Just eight months later, Astro Boy was flying on American TV too.'],

   else robotKid(x,y+40,.8,t,li===3)};

   stk('#6a4a2a',()=>rr(330,590,260,26,6),2.4,6);
   withA(vis(li,0,'sixty',1),()=>stamp('1963',300,150,li===0?B('sixty'):1,'#c0262d'));

   if(li===2)bulb(460,440,B('invention'),t);
   if(li===3){const a=EASE(clamp01(lt()/1));withA(a,()=>{stk('#e8f0f6',()=>rr(250,50,600,170,10),2.4,8);news('#9ccf8a',()=>ell(330,140,50,60),91,.1);news('#9ccf8a',()=>ell(780,140,60,55),92,.1);hand('JAPAN',330,205,26,DK);hand('USA',780,205,26,DK);
     const p=EASE(clamp01(lt()/2.4));c.save();c.setLineDash([10,8]);line([[360,110],[560,70],[750,110]],'#3a6fd8',3);c.restore();const px=360+390*p,py=110-Math.sin(p*Math.PI)*40;c.save();c.translate(px,py);c.rotate(.1);stk('#fffdf4',()=>{c.moveTo(-20,-8);c.lineTo(24,0);c.lineTo(-20,8);c.lineTo(-12,0);c.closePath()},2,3);c.restore()})}});

{chap:'The secret ingredient',era:2,lines:[

  PL(t,1,()=>{const k=li===0?B('manga'):1;if(k>0){for(let i=0;i<5;i++){const drop=li===0?(1-k)*-300:0;magazine(900+i*55,480-i*10+drop,.9,['#e63946','#3a6fd8','#f4c430','#2bb3a3','#e8743b'][i],['JUMP!','POW','WOW','ZAP','BAM'][i])}}

    const vt=since('voted');[[460,KID1],[780,KID3],[880,KID2]].forEach(([x,o],i)=>{const drop=vt>=0&&((vt*1.3+i*.4)%1.4)<.5;toon(x,720,.75,t+i,M(o,{pose:drop?'point':'stand',face:x>630?-1:1,look:x>630?-.6:.6,mouth:'grin'}));if(drop){const p=((vt*1.3+i*.4)%1.4)/.5;stk('#fffdf4',()=>rr(x+(x>630?-40:40)*(1-p)+(630-x)*p*.6-10,560-60*(1-p),20,26,2),1.4,0)}});

 'In two thousand twenty, Demon Slayer: Mugen Train became the highest-grossing film ever in Japan.',
